<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mountain Explorer</title>

    <!-- Required meta info -->
    <meta name="author" content="Joseph Sikowitz, Thai Ken Yong" />
    <meta
      name="description"
      content="Mountain Explorer is a hiking management and planning application where users can search for mountains and trails, manage their account, and save favorite hikes."
    />
    <!-- TODO:Add Favicon -->
    <link rel="icon" type="image/x-icon" href="#" />

    <!-- CDN and local stylesheets, Google fonts-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container-fluid">
        <a class="navbar-brand navbar-text px-5" href="index.html"
          >Mountain Explorer</a
        >
      </div>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
        aria-current="page"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 px-5">
          <li class="nav-item px-5">
            <a class="nav-link navbar-text" href="#">Login</a>
          </li>
        </ul>
      </div>
    </nav>
    <!-- End navbar -->

    <!-- Main content -->
    <main>
        <!-- Hero section -->
        <section class="hero flex-grow-1 d-flex flex-column justify-content-center align-items-center text-center">
          <img
            src="img/dolomites-1.jpg"
            class="img-fluid mx-auto d-block w-50 rounded-pill"
            alt="Hikers in the Dolomites"
          />
          <h1 class="display-4">Welcome to Mountain Explorer</h1>
          <p class="lead">
            Discover the beauty of hiking and exploring the great outdoors.
          </p>
        </section>
        <!-- End hero section -->
    </main>
    <!-- End main content -->

    <!-- Footer -->
    <footer
      class="navbar navbar-expand-lg bottom-0 mt-auto"
    >
      <div class="container-fluid">
        <p class="footer-text">
          &copy; 2026 Mountain Explorer. All rights reserved.
        </p>
      </div>
    </footer>
    <!-- End footer -->

    <!-- CDN and local Javascript files-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/index.js"></script>
  </body>
</html>
