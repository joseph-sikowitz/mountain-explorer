<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Mountain Explorer</title>

    <!-- Required meta info -->
    <meta name="author" content="Thai Ken Yong" />
    <meta
      name="description"
      content="Mountain Explorer is a hiking management and planning application where users can search for mountains and trails, manage their account, and save favorite hikes."
    />
    <!-- TODO:Add Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="img/mountain-explorer-icon.ico"
    />

    <!-- CDN and local stylesheets, Google fonts-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="d-flex flex-column vh-100 mb-auto">
    <!-- Navigation bar -->
    <nav class="navbar navbar-light navbar-expand-lg sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img
            src="img/mountain-explorer-logo-navbar.jpg"
            alt="Mountain Explorer Logo"
            class="logo px-5"
          />
        </a>
        <div>
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 px-5">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- End navbar -->

    <!-- Profile page -->
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <h1>My Profile</h1>

          <!-- Display profile errors -->
          <div id="profile-message"></div>

          <!-- Display user information -->
          <div id="profile">
            <p>
              <strong>First Name:</strong>
              <span id="first-name"></span>
            </p>

            <p>
              <strong>Last Name:</strong>
              <span id="last-name"></span>
            </p>

            <p>
              <strong>Email:</strong>
              <span id="email"></span>
            </p>

            <p>
              <strong>State:</strong>
              <span id="state"></span>
            </p>

            <p>
              <strong>Country:</strong>
              <span id="country"></span>
            </p>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <a href="update-password.html" class="btn btn-primary">
          Update Password
        </a>
      </div>

      <div class="mt-3">
        <button type="button" id="delete-account" class="btn btn-danger">
          Delete this account
        </button>
      </div>

      <div id="delete-message" class="mt-3"></div>
    </main>

    <!-- Footer section -->
    <footer class="footer mt-auto py-3">
      <div class="container text-center">
        <span class="footer-text"
          >&copy; 2026 Mountain Explorer. All rights reserved.</span
        >
      </div>
    </footer>

    <!-- CDN and local Javascript files-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="js/profile.js"></script>
  </body>
</html>
